<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
    
        Test.activate();
      
        Test.create({test() {
            Assert.assertEquals("a\tb", ("a\\tb").unescape());
            Assert.assertEquals("\r\nxxx", ("\\r\\nxxx").unescape());
            Assert.assertNotEquals("\n\rxxx", ("\\r\\nxxx").unescape());
        }});

        Test.create({test() {
            Assert.assertEquals("+(function(){ throw new Error(INJECTED); })()//",
                    ('"+(function(){ throw new Error("INJECTED"); })()//').unescape());
            Assert.assertEquals("+(()=>{ throw new Error(INJECTED); })()//",
                    ('"+(()=>{ throw new Error("INJECTED"); })()//').unescape());
            Assert.assertEquals(";throw new Error(INJECTED);//",
                    ('";throw new Error("INJECTED");//').unescape());
        }});

        Test.create({test() {
            Assert.assertEquals("\\+(function(){ throw new Error(INJECTED); })()//",
                    ('\\\\"+(function(){ throw new Error("INJECTED"); })()//').unescape());
            Assert.assertEquals("\\\\+(function(){ throw new Error(INJECTED); })()//",
                    ('\\\\\\\\"+(function(){ throw new Error("INJECTED"); })()//').unescape());
            Assert.assertEquals("\\\\\\+(function(){ throw new Error(INJECTED); })()//",
                    ('\\\\\\\\\\\\"+(function(){ throw new Error("INJECTED"); })()//').unescape());
        }});

        Test.create({test() {
            Assert.assertEquals("+(eval('throw new Error(INJECTED)'))//",
                    ('"+(eval(\'throw new Error("INJECTED")\'))//').unescape());
            Assert.assertEquals("+(eval(\throw new Error('INJECTED')))//",
                    ('"+(eval("throw new Error(\'INJECTED\')"))//').unescape());
        }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
